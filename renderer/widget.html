<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>牛马鼓励器</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="card">
    <div class="head">
      <div class="brand">
        <span>🐮🐴 牛马鼓励器</span>
        <span class="sep">·</span>
        <span id="dateLabel"></span>
        <span class="badge" id="ghostBadge" hidden>👻 穿透中</span>
      </div>
      <div class="actions">
        <button id="btnSettings" title="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="btnGhost" title="鼠标穿透（Ctrl+Alt+N 切换）">
          <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line class="slash" x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button id="btnQuit" class="danger" title="退出">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="label">今日已赚</div>
    <div class="amount-box" id="amountBox">
      <span class="cur">¥</span><span id="amount">0.000</span>
    </div>
    <div class="sub">
      <span class="edit-salary" id="salaryLine" title="点击修改月薪"></span>
      <span class="sepdot">·</span>
      <span id="rateLine"></span>
    </div>

    <div class="progress"><div id="bar"></div></div>

    <div class="chips">
      <span class="chip" id="chipStatus"></span>
      <span class="chip" id="chipPayday" hidden></span>
      <span class="chip" id="chipPct" hidden></span>
    </div>

    <div class="divider"></div>

    <div class="wt">
      <span>🎯 小目标</span>
      <button class="link" id="wishEdit">编辑</button>
    </div>
    <div class="wishes" id="wishes"></div>

    <div class="divider tight"></div>
    <div class="quote" id="quote" title="点击换一句"></div>

    <div class="qbar">
      <div class="dots" id="themeDots"></div>
      <div class="op" title="透明度（在悬浮窗上 Ctrl+滚轮也可调节）">
        <svg class="drop" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        <input type="range" id="opSlider" min="20" max="100" step="1">
      </div>
    </div>
  </div>

  <script src="themes.js"></script>
  <script src="calc.js"></script>
  <script src="widget.js"></script>
</body>
</html>
